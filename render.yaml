# Render Blueprint for the BoxUp API (Flask backend).
# Frontend: Vercel (apps/frontend). Database: Neon Postgres.
# Data ingestion and model training run in GitHub Actions (.github/workflows).
services:
  - type: web
    name: boxup-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
